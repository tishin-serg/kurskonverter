name: kurskonverter
services:
  bot:
    image: ${BOT_IMAGE:?Set immutable BOT_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      SQLITE_PATH: /data/bot.db
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:18089:8080"
    volumes:
      - bot-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  bot-data:

