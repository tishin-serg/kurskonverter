name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      image: ${{ steps.image.outputs.exact }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.Version=$VERSION -X main.Commit=$GITHUB_SHA -X main.Date=$DATE" -o "dist/bot-linux-$arch" ./cmd/bot
          done
          (cd dist && sha256sum bot-* > checksums.txt)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Registry name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ github.ref_name }}
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            COMMIT=${{ github.sha }}
            DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
      - name: Publish release artifacts
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          printf '%s\n' "$IMAGE" > dist/image.txt
          echo "exact=$IMAGE" >> "$GITHUB_OUTPUT"
          gh release create "$VERSION" dist/* --verify-tag --generate-notes
  deploy:
    needs: publish
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ needs.publish.outputs.image }}
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit
