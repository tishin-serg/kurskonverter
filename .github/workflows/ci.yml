name: CI
on:
  push:
    branches: ['ST/**']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: make lint
      - run: make test
      - run: make test-race
      - run: make coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
      - run: make vuln
      - run: make build
      - run: bash scripts/deploy-test.sh
      - run: make docker-build

